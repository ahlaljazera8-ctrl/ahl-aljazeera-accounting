<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F5C4D">
<title>حسابات أهل الجزيرة (نموذج تجريبي)</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <section id="login" hidden>
    <form id="login-form" autocomplete="on">
      <h1>تسجيل الدخول</h1>
      <p class="sub">أهل الجزيرة للتجارة والمقاولات</p>
      <label>البريد الإلكتروني
        <input id="login-email" class="full" type="email" autocomplete="username" inputmode="email">
      </label>
      <label>كلمة المرور
        <input id="login-password" class="full" type="password" autocomplete="current-password">
      </label>
      <button class="btn" id="login-btn" type="submit">دخول</button>
      <div id="login-msg" class="msg"></div>
      <p class="note">مرة واحدة مع إنترنت، ثم يعمل التطبيق في الموقع بدونه.</p>
    </form>
  </section>
  <div id="shell">
    <header class="top">
      <div><h1 id="title">الرئيسية</h1><div id="who" class="sub"></div></div>
      <span id="outbox" class="pill warn">لم يُرسل بعد: 0</span>
    </header>
    <div class="rolebar">
      <label id="role-label">الدور:
        <select id="role"><option value="owner">المالك · أمير</option><option value="site">مستخدم موقع · أحمد</option></select>
      </label>
      <button id="logout" class="mini" hidden type="button">خروج</button>
      <button id="send" class="mini" type="button">إرسال الآن</button>
    </div>
    <main id="main"></main>
    <nav class="tabs">
      <a href="#home" data-tab="home">●<span>الرئيسية</span></a>
      <a href="#entry" data-tab="entry">●<span>قيد جديد</span></a>
      <a href="#projects" data-tab="projects">●<span>المشاريع</span></a>
    </nav>
  </div>
</div>
<script src="ledger.js"></script>
<script src="sync.js"></script>
<script src="firebase-config.js"></script>
<script src="app.js"></script>
</body>
</html>
