name: CI

permissions:
  contents: read

# One version string for the WebKit archive. runs-on cannot read env, so the
# four jobs pin ubuntu-24.04 themselves and the install step checks they match.
env:
  WEBKIT_UBUNTU: '24.04'

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    name: lint, format, types
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26.13.0
      - name: install
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci
      - name: service worker version
        run: |
          if [ -n "${GITHUB_BASE_REF:-}" ]; then
            git fetch --no-tags origin "$GITHUB_BASE_REF"
            bash scripts/sw-version-guard.sh "origin/$GITHUB_BASE_REF"
          else
            bash scripts/sw-version-guard.sh HEAD^
          fi
      - name: lint
        run: npm run lint
      - name: format
        run: npm run format:check
      - name: typecheck
        run: npm run typecheck

  ledger:
    name: ledger tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26.13.0
      - name: secret-guard
        run: bash scripts/secret-guard.sh
      - name: install
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci
      - name: node --test tests/ledger.test.js
        shell: bash
        run: |
          set +e
          set -o pipefail
          node --test tests/ledger.test.js tests/dom-safe.test.js tests/sync-status.test.js tests/appcheck.test.js tests/rules-constant.test.js tests/secret-guard.test.js tests/owner-access.test.js tests/chrome-debug.test.js tests/cdp-session.test.js tests/shell-cache.test.js tests/project-delete.test.js tests/sw-version-guard.test.js tests/strict-dom-safe.test.js tests/strict-appcheck.test.js tests/strict-sw.test.js tests/strict-sync-status.test.js tests/strict-foremen.test.js tests/accounts.test.js tests/strict-accounts.test.js tests/foremen-ui.test.js tests/people-dir.test.js tests/strict-ledger.test.js tests/strict-sync.test.js tests/strict-session.test.js tests/session-get.test.js tests/firebase-load.test.js tests/flush-retry.test.js tests/signout-pending.test.js tests/rejected-entries.test.js scripts/verify-aj.test.js tests/strict-firebase-client.test.js tests/strict-app.test.js tests/strict-render.test.js tests/strict-firebase-config.test.js tests/strict-people-dir.test.js tests/public-canon-diff.test.js tests/accounts-view.test.js tests/person-delete.test.js tests/strict-accounts-view.test.js tests/accounts-work.test.js tests/strict-accounts-work.test.js tests/accounts-payment.test.js tests/strict-accounts-payment.test.js tests/accounts-correct.test.js tests/strict-accounts-correct.test.js tests/advance-cap.test.js tests/accounts-statement.test.js tests/strict-accounts-statement.test.js tests/accounts-reclass.test.js tests/strict-accounts-reclass.test.js | tee "$RUNNER_TEMP/unit.txt"
          status=${PIPESTATUS[0]}
          set -e
          pass=$(grep -E '[[:space:]]pass [0-9]+$' "$RUNNER_TEMP/unit.txt" | tail -1 | grep -oE '[0-9]+$' || true)
          fail=$(grep -E '[[:space:]]fail [0-9]+$' "$RUNNER_TEMP/unit.txt" | tail -1 | grep -oE '[0-9]+$' || true)
          echo "unit tests: ${pass:-missing} pass, ${fail:-missing} fail"
          if [[ "$status" -ne 0 || -z "$pass" || -z "$fail" || "$fail" != "0" || "$pass" -lt 34 ]]; then
            exit 1
          fi

  browser:
    name: browser checks
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26.13.0
      - name: secret-guard
        run: bash scripts/secret-guard.sh
      - name: browser checks
        shell: bash
        run: |
          set +e
          set -o pipefail
          mkdir -p shots
          python3 -m http.server 8765 --bind 127.0.0.1 --directory public >"$RUNNER_TEMP/http.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          ready=0
          for _ in $(seq 1 50); do
            if curl -sf -o /dev/null http://127.0.0.1:8765/index.html; then
              ready=1
              break
            fi
            sleep 0.2
          done
          if [[ "$ready" -ne 1 ]]; then
            echo "static server did not start"
            cat "$RUNNER_TEMP/http.log" || true
            exit 1
          fi
          node tests/browser-check.js | tee "$RUNNER_TEMP/browser.txt"
          status=${PIPESTATUS[0]}
          set -e
          summary=$(grep 'browser checks:' "$RUNNER_TEMP/browser.txt" | tail -1 || true)
          pass=$(printf '%s\n' "$summary" | sed -n 's/.*browser checks: \([0-9][0-9]*\)\/[0-9][0-9]* passed/\1/p')
          fails=$(grep -c '^FAIL ' "$RUNNER_TEMP/browser.txt" || true)
          echo "browser checks: ${pass:-missing} pass, ${fails:-missing} fail"
          if [[ "$status" -ne 0 || -z "$pass" || "$fails" != "0" || "$pass" -lt 45 ]]; then
            exit 1
          fi

  emulator:
    name: emulator rules and sync
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26.13.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
      - name: secret-guard
        run: bash scripts/secret-guard.sh
      - name: install
        timeout-minutes: 10
        run: npm ci
      - name: install webkit
        timeout-minutes: 15
        run: |
          set -euxo pipefail
          # Playwright's own unzip of this archive does not finish on the runner.
          # curl + system unzip lands the same tree Playwright expects, including
          # the empty INSTALLATION_COMPLETE marker that marks a finished install.
          # runs-on cannot read WEBKIT_UBUNTU, so this step is the check that the
          # runner image and the archive name are the same Ubuntu version.
          os_id="$(. /etc/os-release && printf '%s' "$VERSION_ID")"
          zip_name="webkit-ubuntu-${WEBKIT_UBUNTU}.zip"
          if [[ "$os_id" != "$WEBKIT_UBUNTU" || "$zip_name" != "webkit-ubuntu-${os_id}.zip" ]]; then
            echo "install webkit refused: /etc/os-release VERSION_ID is '${os_id}', WEBKIT_UBUNTU is '${WEBKIT_UBUNTU}', archive is '${zip_name}'." >&2
            echo "The WebKit dependency script installs the libraries for that Ubuntu. webkit-ubuntu-24.04.zip needs libicu74 and libvpx9. On Ubuntu 26.04 apt exits 100, which is how emulator job 129341047932 failed after ubuntu-latest moved to 26.04." >&2
            echo "Follow-up: when Playwright ships webkit-ubuntu-26.04.zip, bump WEBKIT_UBUNTU and the four runs-on labels together. Do not change one without the other. https://github.com/ahlaljazera8-ctrl/ahl-aljazeera-accounting/issues/55" >&2
            exit 1
          fi
          REV=2215
          DEST="${HOME}/.cache/ms-playwright/webkit-${REV}"
          URL="https://cdn.playwright.dev/dbazure/download/playwright/builds/webkit/${REV}/${zip_name}"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          curl -fsSL --retry 3 --retry-delay 2 -o /tmp/webkit.zip "$URL"
          unzip -q /tmp/webkit.zip -d "$DEST"
          rm -f /tmp/webkit.zip
          : > "$DEST/INSTALLATION_COMPLETE"
          test -x "$DEST/pw_run.sh"
          test -x "$DEST/minibrowser-wpe/MiniBrowser"
          export DEBIAN_FRONTEND=noninteractive
          # AWS-hosted ubuntu-24.04 runners list us-east-2.ec2.archive.ubuntu.com first in
          # apt's mirror list. On 2026-11-23/24 it ran at 80-350 kB/s and the ~100 MB of WebKit
          # deps overran this step. Drop only that line; the image's https archive (priority 2)
          # and security (priority 3) entries stay. Azure runners have no ec2 line: no change.
          mirrors=/etc/apt/apt-mirrors.txt
          if [[ -r "$mirrors" && -s "$mirrors" ]]; then
            cat "$mirrors"
            if grep -q '\.ec2\.archive\.ubuntu\.com' "$mirrors"; then
              others=$(grep -v '\.ec2\.archive\.ubuntu\.com' "$mirrors" | grep -Ec '^https?://' || true)
              if [[ "${others:-0}" -ge 1 ]]; then
                sudo sed -i '/\.ec2\.archive\.ubuntu\.com/d' "$mirrors"
                echo "::notice::apt mirror override applied: $(head -n1 "$mirrors")"
              else
                echo "::warning::$mirrors has only the ec2 mirror; override not applied"
              fi
            else
              echo "apt mirror override not needed: no ec2 mirror in $mirrors"
            fi
          elif [[ -r "$mirrors" ]]; then
            echo "::warning::$mirrors is empty; apt mirror override not applied"
          else
            echo "::warning::$mirrors is missing or unreadable; apt mirror override not applied"
          fi
          if grep -rqs '\.ec2\.archive\.ubuntu\.com' /etc/apt/sources.list /etc/apt/sources.list.d/; then
            echo "::warning::an ec2 apt mirror is listed outside $mirrors; override not applied there"
          fi
          echo "apt Acquire settings (no lines = apt defaults):"
          apt-config dump Acquire::Retries Acquire::http::Timeout Acquire::https::Timeout || true
          # Headless WebKit is the WPE build; Playwright also ldd-checks the GTK build.
          sudo --preserve-env=DEBIAN_FRONTEND bash "$DEST/minibrowser-wpe/install-dependencies.sh" --autoinstall
          sudo --preserve-env=DEBIAN_FRONTEND bash "$DEST/minibrowser-gtk/install-dependencies.sh" --autoinstall
          node -e "const {webkit}=require('playwright'); const p=webkit.executablePath(); if(!p.endsWith('/pw_run.sh')) throw new Error(p); console.log(p)"
      - name: emulators:exec
        shell: bash
        run: |
          set +e
          set -o pipefail
          bash scripts/emulators-exec.sh --only auth,firestore,hosting --project ahl-aljazeera-accounting \
            "node --test --test-concurrency=1 --test-force-exit tests/emulator/rules.test.js tests/emulator/account-rules.test.js tests/emulator/account-adopt.test.js tests/emulator/payment-half-refused.test.js tests/emulator/sync.test.js tests/emulator/flush-retry.test.js tests/emulator/incremental-pull.test.js tests/emulator/login-relogin.test.js tests/emulator/logout-fields.test.js tests/emulator/app-entry.test.js tests/emulator/offline-reconnect.test.js tests/emulator/offline-cold-start.test.js tests/emulator/session-live.test.js tests/emulator/project-gone.test.js tests/sw-cache.test.js tests/webkit-upgrade.test.js tests/emulator/account-correct.test.js tests/emulator/security-headers.test.js tests/emulator/advance-cap.test.js tests/emulator/account-statement.test.js tests/emulator/account-reclass.test.js" \
            | tee "$RUNNER_TEMP/emulator.txt"
          status=${PIPESTATUS[0]}
          set -e
          pass=$(grep -E '[[:space:]]pass [0-9]+$' "$RUNNER_TEMP/emulator.txt" | tail -1 | grep -oE '[0-9]+$' || true)
          fail=$(grep -E '[[:space:]]fail [0-9]+$' "$RUNNER_TEMP/emulator.txt" | tail -1 | grep -oE '[0-9]+$' || true)
          echo "emulator tests: ${pass:-missing} pass, ${fail:-missing} fail"
          if [[ "$status" -ne 0 || -z "$pass" || -z "$fail" || "$fail" != "0" || "$pass" -lt 294 ]]; then
            exit 1
          fi
