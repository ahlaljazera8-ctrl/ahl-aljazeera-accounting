name: CI

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  ledger:
    name: ledger tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26.13.0
      - name: secret-guard
        run: bash scripts/secret-guard.sh
      - name: node --test tests/ledger.test.js
        shell: bash
        run: |
          set +e
          set -o pipefail
          node --test tests/ledger.test.js tests/dom-safe.test.js tests/sync-status.test.js tests/appcheck.test.js tests/rules-constant.test.js tests/secret-guard.test.js | tee "$RUNNER_TEMP/unit.txt"
          status=${PIPESTATUS[0]}
          set -e
          pass=$(grep -E '[[:space:]]pass [0-9]+$' "$RUNNER_TEMP/unit.txt" | tail -1 | grep -oE '[0-9]+$' || true)
          fail=$(grep -E '[[:space:]]fail [0-9]+$' "$RUNNER_TEMP/unit.txt" | tail -1 | grep -oE '[0-9]+$' || true)
          echo "unit tests: ${pass:-missing} pass, ${fail:-missing} fail"
          if [[ "$status" -ne 0 || -z "$pass" || -z "$fail" || "$fail" != "0" || "$pass" -lt 34 ]]; then
            exit 1
          fi

  browser:
    name: browser checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26.13.0
      - name: secret-guard
        run: bash scripts/secret-guard.sh
      - name: browser checks
        shell: bash
        run: |
          set +e
          set -o pipefail
          mkdir -p shots
          python3 -m http.server 8765 --bind 127.0.0.1 --directory public >"$RUNNER_TEMP/http.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          ready=0
          for _ in $(seq 1 50); do
            if curl -sf -o /dev/null http://127.0.0.1:8765/index.html; then
              ready=1
              break
            fi
            sleep 0.2
          done
          if [[ "$ready" -ne 1 ]]; then
            echo "static server did not start"
            cat "$RUNNER_TEMP/http.log" || true
            exit 1
          fi
          node tests/browser-check.js | tee "$RUNNER_TEMP/browser.txt"
          status=${PIPESTATUS[0]}
          set -e
          summary=$(grep 'browser checks:' "$RUNNER_TEMP/browser.txt" | tail -1 || true)
          pass=$(printf '%s\n' "$summary" | sed -n 's/.*browser checks: \([0-9][0-9]*\)\/[0-9][0-9]* passed/\1/p')
          fails=$(grep -c '^FAIL ' "$RUNNER_TEMP/browser.txt" || true)
          echo "browser checks: ${pass:-missing} pass, ${fails:-missing} fail"
          if [[ "$status" -ne 0 || -z "$pass" || "$fails" != "0" || "$pass" -lt 45 ]]; then
            exit 1
          fi

  emulator:
    name: emulator rules and sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26.13.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
      - name: secret-guard
        run: bash scripts/secret-guard.sh
      - name: install
        run: npm ci
      - name: install webkit
        timeout-minutes: 20
        run: npx playwright install webkit
      - name: emulators:exec
        shell: bash
        run: |
          set +e
          set -o pipefail
          npx firebase emulators:exec --only auth,firestore --project ahl-aljazeera-accounting \
            "node --test --test-concurrency=1 --test-force-exit tests/emulator/rules.test.js tests/emulator/sync.test.js tests/emulator/login-relogin.test.js tests/sw-cache.test.js tests/webkit-upgrade.test.js" \
            | tee "$RUNNER_TEMP/emulator.txt"
          status=${PIPESTATUS[0]}
          set -e
          pass=$(grep -E '[[:space:]]pass [0-9]+$' "$RUNNER_TEMP/emulator.txt" | tail -1 | grep -oE '[0-9]+$' || true)
          fail=$(grep -E '[[:space:]]fail [0-9]+$' "$RUNNER_TEMP/emulator.txt" | tail -1 | grep -oE '[0-9]+$' || true)
          echo "emulator tests: ${pass:-missing} pass, ${fail:-missing} fail"
          if [[ "$status" -ne 0 || -z "$pass" || -z "$fail" || "$fail" != "0" || "$pass" -lt 33 ]]; then
            exit 1
          fi
